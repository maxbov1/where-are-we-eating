name: Build and push API image

on:
  workflow_run:
    workflows: [Group Reservations CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'where-are-we-eating-api' }}

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$ECR_REPOSITORY" >/dev/null

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "image=$REGISTRY/$ECR_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./group-reservations
          file: group-reservations/app/api/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:${{ steps.image.outputs.sha_tag }}

      - name: Roll out image to ECS Express Mode
        env:
          ECS_SERVICE_ARN: ${{ vars.ECS_SERVICE_ARN }}
          IMAGE: ${{ steps.image.outputs.image }}:${{ steps.image.outputs.sha_tag }}
        run: |
          test -n "$ECS_SERVICE_ARN" || {
            echo "Missing repository variable ECS_SERVICE_ARN"
            exit 1
          }

          aws ecs update-express-gateway-service \
            --region "$AWS_REGION" \
            --service-arn "$ECS_SERVICE_ARN" \
            --primary-container "{\"image\":\"$IMAGE\"}" \
            --no-cli-pager
