name: Group Reservations CI

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: group-reservations-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: Deterministic checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: group-reservations
    env:
      PYTHONPATH: src
      GROUP_RESERVATIONS_JWT_SECRET: ci-only-secret-with-at-least-32-chars

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: group-reservations/pyproject.toml

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: Run network-free Python tests
        run: python -m pytest -q tests/test_database.py tests/test_booking.py tests/test_auth.py tests/test_agent_state.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate frontend JavaScript
        run: node --check frontend/app.js

      - name: Check patch whitespace
        working-directory: .
        run: git diff --check
