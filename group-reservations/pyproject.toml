[project]
name = "group-reservations"
version = "0.1.0"
description = "Structured group coordination for restaurant reservations"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "strands-agents>=1.0.0",
    "mcp>=1.0.0",
    "boto3>=1.35.0",
    "botocore[crt]>=1.35.0",
    "python-dotenv>=1.0.0",
    "PyJWT>=2.8.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
