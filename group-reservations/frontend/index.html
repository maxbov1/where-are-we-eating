<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=landing.html" />
    <title>Where Are We Eating?</title>
  </head>
  <body>
    <script>
      const query = window.location.search;
      const params = new URLSearchParams(query);
      const destination = params.has('survey')
        ? `guest-survey.html${query}`
        : params.has('organizer')
          ? `organizer-events.html${query}`
          : `landing.html${query}`;
      window.location.replace(destination);
    </script>
    <p><a href="landing.html">Continue to Where Are We Eating?</a></p>
  </body>
</html>
